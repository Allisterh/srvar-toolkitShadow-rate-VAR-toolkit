name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli,fred,docs,plot,excel]"
      - name: Lint
        run: ruff check srvar tests scripts
      - name: Format
        run: ruff format --check srvar tests scripts
      - name: Type check
        if: matrix.python-version == '3.11'
        run: mypy srvar
      - name: Test
        run: pytest

  optional-integrations:
    name: Optional integrations (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project with optional integrations
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli,fred,plot,excel,xarray,arviz,accel]"
      - name: Test optional integrations
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -c 'import arviz, numba, xarray; from srvar import sv; assert sv._HAVE_NUMBA'
          python -m pytest

  docs:
    name: Documentation (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli,fred,docs,plot,excel]"
      - name: Build documentation
        run: sphinx-build -W -b html docs docs/_build/html
